name: Deploy Service

on:
  repository_dispatch:
    types: [deploy]
  workflow_dispatch:
    inputs:
      service:
        description: "Service name (folder name under services/)"
        required: true
        type: string

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Resolve service and project ID
        id: svc
        run: |
          SERVICE="${{ github.event.client_payload.service || inputs.service }}"
          echo "service=$SERVICE" >> "$GITHUB_OUTPUT"
          PROJECT_ID=$(jq -re --arg s "$SERVICE" 'if has($s) then .[$s] else error("Unknown service: \($s)") end' infisical-projects.json)
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: INFISICAL_CLIENT_ID,INFISICAL_CLIENT_SECRET,PROJECT_ID,SERVICE
          script: |
            cd /opt/homelab
            git pull --ff-only
            bash scripts/deploy.sh "$SERVICE" "$PROJECT_ID"
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          PROJECT_ID: ${{ steps.svc.outputs.project_id }}
          SERVICE: ${{ steps.svc.outputs.service }}